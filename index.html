
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECHO - Advanced AI Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/sql-wasm.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
    
    :root {
      --bg-main: #ffffff;
      --bg-sidebar: #f8fafc;
      --accent-echo: #0ea5e9;
      --accent-echo-glow: #22d3ee;
      --text-main: #0f172a;
      --border-color: #f1f5f9;
    }

    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      overflow: hidden;
      font-size: 16px;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

    .sidebar-transition {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ECHO Core Animation */
    @keyframes orbit-cw { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes orbit-ccw { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes pulse-soft { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }

    .echo-ring-outer { animation: orbit-cw 8s linear infinite; }
    .echo-ring-inner { animation: orbit-ccw 4s linear infinite; }
    .echo-core-pulse { animation: pulse-soft 2s ease-in-out infinite; }

    .input-box {
      box-shadow: 0 4px 20px rgba(0,0,0,0.02), 0 10px 40px rgba(0,0,0,0.04);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid #f1f5f9;
      background-color: #ffffff;
    }

    .input-box:focus-within {
      box-shadow: 0 12px 48px rgba(14, 165, 233, 0.08);
      border-color: #bae6fd;
    }

    .active-session {
      background: #ffffff;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.05);
      border-left: 3px solid var(--accent-echo);
    }

    .prose { font-size: 16px; line-height: 1.75; color: #334155; }
    .prose pre { border-radius: 20px; border: 1px solid #f1f5f9; }

    .expand-grid { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s ease-out; }
    .expand-grid.expanded { grid-template-rows: 1fr; }
    .expand-content { overflow: hidden; }

    .user-bubble {
      background-color: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 24px;
      padding: 1.2rem 1.6rem;
      max-width: 85%;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-markdown": "https://esm.sh/react-markdown@^9.0.0",
    "remark-gfm": "https://esm.sh/remark-gfm@^4.0.0",
    "rehype-raw": "https://esm.sh/rehype-raw@^7.0.0",
    "rehype-highlight": "https://esm.sh/rehype-highlight@^7.0.0"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
