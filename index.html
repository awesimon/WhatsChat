
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumi - Personal Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/sql-wasm.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Outfit:wght@400;500;600&display=swap');
    
    :root {
      --bg-warm: #f8fafc; /* Slate-50 */
      --bg-white: #ffffff;
      --primary: #4f46e5; /* Indigo-600 */
      --primary-soft: #e0e7ff; /* Indigo-100 */
      --text-main: #1e293b; /* Slate-800 */
      --text-soft: #64748b; /* Slate-500 */
      --shadow-sm: 0 2px 8px rgba(79, 70, 229, 0.08);
      --shadow-lg: 0 10px 30px -5px rgba(79, 70, 229, 0.15);
      --glass: rgba(255, 255, 255, 0.9);
    }

    body { 
      font-family: 'Nunito', sans-serif; 
      background-color: var(--bg-warm); 
      color: var(--text-main); 
      overflow: hidden;
      /* Cool, modern gradient */
      background-image: radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
    }

    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Utilities */
    .glass-panel {
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .card-hover {
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card-hover:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    /* Increased font sizes for Prose */
    .prose { color: var(--text-main); font-size: 1.05rem; line-height: 1.75; }
    .prose strong { color: #4338ca; font-weight: 700; }
    .prose code { color: #4f46e5; background: #eef2ff; padding: 2px 6px; border-radius: 4px; font-family: 'Outfit', monospace; font-size: 0.95em; border: 1px solid #e0e7ff; }
    .prose pre { background: #0f172a !important; color: #f1f5f9; border-radius: 10px; padding: 1.25rem; margin: 1.25rem 0; font-size: 0.95em; }
    .prose h1, .prose h2, .prose h3 { font-family: 'Outfit', sans-serif; color: #0f172a; font-weight: 700; margin-top: 1.5em; margin-bottom: 0.6em; }
    .prose ul { list-style-type: disc; padding-left: 1.4em; }
    .prose a { color: var(--primary); text-decoration: none; border-bottom: 1px dashed var(--primary); transition: all 0.2s; }
    .prose a:hover { background: var(--primary-soft); border-bottom-style: solid; }
    
    .prose blockquote { border-left: 4px solid #cbd5e1; padding-left: 1.25rem; font-style: italic; color: #64748b; }

    .expand-grid { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s ease-out; }
    .expand-grid.expanded { grid-template-rows: 1fr; }
    .expand-content { overflow: hidden; }

    .animate-float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    
    .typing-dot { animation: bounce 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-markdown": "https://esm.sh/react-markdown@^9.0.0",
    "remark-gfm": "https://esm.sh/remark-gfm@^4.0.0",
    "rehype-raw": "https://esm.sh/rehype-raw@^7.0.0",
    "rehype-highlight": "https://esm.sh/rehype-highlight@^7.0.0"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
